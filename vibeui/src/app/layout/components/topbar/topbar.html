<header class="h-20 !border-b !border-[var(--vibe-glass-border)] bg-[var(--vibe-glass-bg)] backdrop-blur-xl flex items-center justify-between px-8 sticky top-0 z-40 transition-all duration-300">
  <div class="flex items-center flex-1">
    <div class="relative w-full max-w-md group">
      <i class="pi pi-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
      <input type="text" pInputText placeholder="Search for projects, tasks..." 
        class="w-full !bg-[var(--vibe-faint-bg)] !border-[var(--vibe-glass-border)] focus:!border-indigo-500/30 focus:!ring-4 focus:!ring-indigo-500/10 !rounded-2xl !pl-12 !py-3 !text-sm !text-[var(--vibe-text)] placeholder:!text-slate-500 transition-all" />
    </div>
  </div>

  <div class="flex items-center gap-4">
    <div class="hidden md:flex items-center gap-2">
      <p-button icon="pi pi-bell" [rounded]="true" [text]="true" severity="secondary" styleClass="!text-[var(--vibe-muted)] hover:!text-[var(--vibe-text)] hover:!bg-[var(--vibe-faint-bg)] transition-all">
          <i pBadge [value]="'3'" severity="danger" styleClass="!text-[8px] !min-w-[14px] !h-[14px]"></i>
      </p-button>
      <p-button icon="pi pi-cog" [routerLink]="['/dashboard/settings']" [rounded]="true" [text]="true" severity="secondary" styleClass="!text-slate-400 hover:!text-[var(--vibe-text)] hover:!bg-[var(--vibe-faint-bg)]"></p-button>
    </div>

    <div class="h-8 w-[1px] bg-[var(--vibe-glass-border)] mx-2 hidden md:block"></div>

    <div class="flex items-center gap-4 pl-2 cursor-pointer group" (click)="userMenu.toggle($event)">
      <p-menu #userMenu [model]="userMenuItems" [popup]="true" appendTo="body" styleClass="!shadow-2xl !border-[var(--vibe-glass-border)] !bg-[var(--vibe-glass-bg)] !backdrop-blur-xl !rounded-2xl !p-2">
        <ng-template #item let-item>
            <a class="flex items-center gap-3 px-4 py-2.5 rounded-xl transition-all duration-200 hover:bg-indigo-500/10 group/item">
                <i [class]="item.icon + ' text-slate-500 group-hover/item:text-indigo-400'"></i>
                <span class="font-bold text-sm text-[var(--vibe-text)] group-hover/item:text-indigo-400">{{ item.label }}</span>
            </a>
        </ng-template>
      </p-menu>
      <div class="text-right hidden sm:block leading-tight">
        <p class="text-sm font-bold text-[var(--vibe-text)] group-hover:text-indigo-400 transition-colors">Alex Rivera</p>
        <p class="text-[10px] font-black uppercase tracking-widest text-slate-500">Administrator</p>
      </div>
      <div class="relative">
        <p-avatar image="https://i.pravatar.cc/150?u=antigravity" shape="circle" size="large" 
          styleClass="!w-12 !h-12 border-2 !border-[var(--vibe-glass-border)] group-hover:border-indigo-500/50 transition-all shadow-xl shadow-black/20" />
        <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-[var(--vibe-surface)] rounded-full"></div>
      </div>
    </div>
  </div>
</header>
