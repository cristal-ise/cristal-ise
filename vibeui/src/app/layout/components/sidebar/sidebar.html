<div class="h-full flex flex-col glass-effect border-r border-[var(--vibe-glass-border)] bg-[var(--vibe-card-bg)]">
  <div class="p-6 pb-0">
    <div class="flex items-center gap-3 mb-10 group cursor-pointer">
      <div class="w-10 h-8 premium-gradient rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 group-hover:scale-110 transition-transform duration-300">
        <i class="pi pi-bolt text-xl"></i>
      </div>
      <span class="text-2xl font-black tracking-tighter bg-[var(--vibe-text)] bg-clip-text">VIBEUI</span>
    </div>
  </div>

  <nav class="flex-1 px-8 py-4 overflow-y-auto custom-scrollbar min-h-0">
    <p-tree [value]="(treeNodes$ | async) || []" selectionMode="single" class="w-full bg-transparent border-none p-0">
      <ng-template let-node pTemplate="default">
        <div [routerLink]="node.routerLink"
             class="flex items-center gap-3 py-2 rounded-xl text-[var(--vibe-text)] hover:bg-slate-800/40 transition-all duration-300 group w-full cursor-pointer">
          <i [class]="node.theicon + ' text-lg group-hover:scale-110 transition-transform'"></i>
          <span class="font-light text-xl">{{ node.label | transloco }}</span>
        </div>
      </ng-template>
    </p-tree>
  </nav>

  <div class="mt-auto p-8">
     <div class="glass-card rounded-2xl p-4 border border-[var(--vibe-glass-border)] bg-indigo-500/5">
        <p class="text-[10px] font-black uppercase tracking-widest text-indigo-400 mb-2">{{ 'layout.pro_plan' | transloco }}</p>
        <p class="text-xs text-slate-400 font-medium mb-4">{{ 'layout.pro_plan_desc' | transloco }}</p>
        <p-button [label]="'layout.upgrade' | transloco" styleClass="w-full !py-2 !text-xs premium-gradient border-none !rounded-xl font-bold"></p-button>
     </div>
  </div>
</div>
