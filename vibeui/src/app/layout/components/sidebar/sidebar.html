<div class="h-full flex flex-col glass-effect border-r border-white/5 bg-slate-900/40">
  <div class="p-8">
    <div class="flex items-center gap-3 mb-10 group cursor-pointer">
      <div class="w-10 h-10 premium-gradient rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 group-hover:scale-110 transition-transform duration-300">
        <i class="pi pi-bolt text-xl"></i>
      </div>
      <span class="text-2xl font-black tracking-tighter bg-white bg-clip-text text-transparent">VIBEUI</span>
    </div>

    <nav class="space-y-2">
      @for (item of menuItems; track item.label) {
        <a [routerLink]="item.routerLink"
           routerLinkActive="!bg-indigo-500/10 !text-white !border-indigo-500/50 shadow-lg shadow-indigo-500/5"
           [routerLinkActiveOptions]="{exact: true}"
           class="flex items-center gap-4 px-4 py-3.5 text-slate-400 hover:text-white hover:bg-white/5 border border-transparent rounded-2xl transition-all duration-300 group">
          <div class="w-5 flex justify-center">
            <i [class]="item.icon + ' text-lg group-hover:scale-110 transition-transform'"></i>
          </div>
          <span class="font-bold tracking-tight text-sm">{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <div class="mt-auto p-8">
     <div class="glass-card rounded-2xl p-4 border border-white/5 bg-indigo-500/5">
        <p class="text-[10px] font-black uppercase tracking-widest text-indigo-400 mb-2">Pro Plan</p>
        <p class="text-xs text-slate-400 font-medium mb-4">Unlock advanced analytics and AI features.</p>
        <p-button label="Upgrade" styleClass="w-full !py-2 !text-xs premium-gradient border-none !rounded-xl font-bold"></p-button>
     </div>
  </div>
</div>
